benchmark: "^GSPC"
start_date: "2022-01-01"

filter1:
  threshold: 0.40       # ajusta entre 0.3-0.6 según cuántos quieres pasar
  w_reg: 0.40
  w_pct: 0.30
  w_tec: 0.30

filter2_mode: "buy_only"

fundamental:
  growth_explicit: 0.08
  terminal_growth: 0.025
  explicit_years: 5

portfolio:
  frontier_points: 100

cache_dir: "cache/"
cache_ttl_hours: 24
output_dir: "output/"
